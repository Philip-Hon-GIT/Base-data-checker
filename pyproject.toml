[project]
name = "basedata-checker"
version = "0.2.0"
description = "Checks base data files in a local or OneDrive folder against project requirements and keeps a register in a local SQLite file."
requires-python = ">=3.12"
dependencies = ["starlette>=0.37", "uvicorn>=0.29", "openpyxl>=3.1", "pypdf>=4.0",
                "pyyaml>=6.0", "numpy>=1.26", "tifffile>=2024.1.30"]

[project.optional-dependencies]
geo = ["pyproj>=3.6", "rasterio>=1.3", "laspy[lazrs]>=2.5", "pyogrio>=0.7"]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[tool.setuptools.packages.find]
include = ["basedata*"]

[tool.setuptools.package-data]
basedata = ["data/*.yaml", "prompts/*.yaml", "ai/prompts/*.md", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
